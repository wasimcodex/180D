name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # connectedDebugAndroidTest is intentionally not run here — it requires
      # a physical device with a real BLE radio (see CLAUDE.md "A physical
      # device is mandatory"); the emulator has no Bluetooth support.
      - name: Unit tests
        run: ./gradlew test

      - name: Lint
        run: ./gradlew lint

      - name: Assemble debug APK
        run: ./gradlew assembleDebug
